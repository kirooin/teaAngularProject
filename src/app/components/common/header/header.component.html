<header class="p-3 mb-3 bg-light">
  <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
    <a href="#"
       class="d-flex align-items-center mb-2 mb-lg-0 link-body-emphasis text-decoration-none">
    </a>
    <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0 align-items-center">
      <li><a href="#" class="nav-link px-2 " routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Главная</a></li>
      <li><a href="#" class="nav-link px-2 " routerLink="/products" routerLinkActive="active">Каталог</a></li>
    </ul>
    <form class="row align-items-center mb-3 mb-lg-0 me-0" role="search" (ngSubmit)="onSearch()">
      <input type="text" class="form-control col me-2 pe-5 ps-3" placeholder="Поиск чая" [(ngModel)]="searchQuery" name="searchQuery">
      <button class="btn btn-outline-primary col px-0" >Найти</button>
    </form>
  </div>
</header>
