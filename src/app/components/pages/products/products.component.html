<div class="container py-4 mb-5 pb-4">
  <h2 class="text-center mb-5 fw-bold">Наши чайные коллекции</h2>
  <div class="row row-cols-2 g-3 d-flex justify-content-center " >

    <div class="col" *ngFor="let product of products">
      <div class="card shadow-sm h-100 d-flex flex-column align-items-center ">
        <div class="card-body d-flex flex-column align-items-center justify-content-around">
          <img src="{{ product.image }}" class="w-50" alt="">

          <h5 class="fw-bold text-center">{{ product.title }}</h5>
          <p class="card-text text-center">{{ product.description }}</p>
          <div class="d-flex">
            <div class="btn-group d-flex ">
              <button type="button" class="btn btn-primary px-5 hvr-buzz-out" [routerLink]="['/product/',  product.id]">
                Подробнее
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
