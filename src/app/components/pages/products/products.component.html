<div class="container py-4 mb-5 pb-4">
  <h2 class="text-center mb-5 fw-bold">Наши чайные коллекции</h2>
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

    <div class="col w-50" *ngFor="let product of products">
      <div class="card shadow-sm">
        <img src="{{ product.image }}" class="w-25" alt="">
        <div class="card-body">
          <h5 class="fw-bold">{{ product.title }}</h5>
          <p class="card-text">{{ product.description }}</p>
          <div class="d-flex justify-content-between align-items-center">
            <div class="btn-group">
              <button type="button" class="btn btn-primary px-5 hvr-buzz-out" [routerLink]="['/product/',  product.id]">
                Подробнее
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
